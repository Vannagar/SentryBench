[project]
name = "sentrybench"
version = "0.0.1"
description = "A benchmark that ranks monitors for multi-agent collusion."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
